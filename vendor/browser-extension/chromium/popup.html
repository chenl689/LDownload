<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LDownload</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: #172235; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { width: 360px; min-height: 250px; max-height: 680px; margin: 0; padding: 17px; overflow: auto; }
    header { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
    .mark { display: block; flex: none; width: 34px; height: 34px; object-fit: contain; }
    h1 { margin: 0; font-size: 16px; } p { margin: 3px 0 0; color: #758198; font-size: 11px; }
    #status { margin: 8px 0; color: #758198; font-size: 11px; }
    .auto-capture { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; padding: 9px 10px; border: 1px solid #dfe5f0; border-radius: 9px; color: #455269; background: #fff; font-size: 10px; }
    .auto-capture input { flex: none; margin: 2px 0 0; accent-color: #4367ec; }
    #links { display: grid; gap: 6px; max-height: 300px; overflow: auto; }
    .link { display: flex; align-items: flex-start; gap: 8px; padding: 8px 9px; border: 1px solid #e4e9f0; border-radius: 9px; background: white; }
    .link input { flex: none; margin: 2px 0 0; accent-color: #4367ec; }
    .link span { overflow-wrap: anywhere; color: #455269; font-size: 10px; }
    footer { display: flex; gap: 7px; margin-top: 11px; }
    button { min-height: 33px; padding: 0 11px; border: 1px solid #dce2ec; border-radius: 9px; color: #516079; background: white; cursor: pointer; font: inherit; font-size: 11px; }
    button.primary { border: 0; color: white; background: linear-gradient(135deg,#5577f1,#3f60dc); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #diagnostics { margin-top: 10px; padding: 8px 10px; border: 1px solid #dfe5f0; border-radius: 9px; background: #fff; color: #516079; font-size: 11px; }
    #diagnostics summary { cursor: pointer; font-weight: 600; }
    #diagnosticText { width: 100%; height: 180px; margin-top: 7px; padding: 7px; resize: vertical; border: 1px solid #dfe5f0; border-radius: 7px; font: 10px/1.4 Consolas, monospace; }
    #diagnosticActions { display: flex; gap: 7px; margin-top: 6px; }
    #selectAll { margin-right: auto; }
    @media (prefers-color-scheme: dark) { :root { color: #ecf1fa; background: #121720; } p,#status { color: #a0adc1; } .link,button,.auto-capture { border-color: #344054; color: #d5ddeb; background: #1b2230; } .link span { color: #c0cad9; } button.primary { color: white; background: linear-gradient(135deg,#5577f1,#3f60dc); } }
  </style>
</head>
<body>
  <header><img class="mark" src="icons/app-icon-32.png" alt="" /><div><h1>LDownload</h1><p>收集当前页可下载文件链接</p></div></header>
  <div id="status" role="status" aria-live="polite">正在读取当前网页…</div>
  <label class="auto-capture"><input id="autoCapture" type="checkbox" /><span><strong>自动接管浏览器下载</strong><br />开启后，点击带有下载标记或文件后缀的链接时会在请求发出前交给 LDownload，并弹出新建任务供你确认；确认前不会开始下载，浏览器原下载请求会取消。启用时浏览器会询问网站访问权限。默认关闭。</span></label>
  <div id="links"></div>
  <footer><button id="selectAll" type="button" disabled>全选</button><button id="refresh" type="button">重新读取</button><button id="send" class="primary" type="button" disabled>交给 LDownload</button></footer>
  <details id="diagnostics"><summary>浏览器接管诊断日志</summary><p>直接点击网页下载后，在这里查看步骤；点击“选中日志”再按 Ctrl+C 复制。</p><textarea id="diagnosticText" readonly></textarea><div id="diagnosticActions"><button id="refreshDiagnostics" type="button">刷新日志</button><button id="selectDiagnostics" type="button">选中日志</button></div></details>
  <script src="popup.js"></script>
</body>
</html>
